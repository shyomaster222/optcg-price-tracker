# Config for the weekly-report cron service only.
# Set "Config file path" to /railway.weekly-report.toml in Railway.

[build]
builder = "nixpacks"

[deploy]
startCommand = "python scripts/run_weekly_business_report.py"
# Railway cron schedules are UTC. Friday 01:00 UTC is Friday 09:00 HKT.
cronSchedule = "0 1 * * 5"
# No healthcheckPath: this job must finish and exit.
restartPolicyType = "NEVER"
